[package]
name = "solana-kafka-indexer"
version = "0.1.5"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5.0"
substreams-solana = { git = "https://github.com/streamingfast/substreams-solana", branch = "master" }
prost = "0.11"
anyhow = "1"
prost-types = "0.11"
chrono = { version = "0.4", features = [ "std" ], default-features = false }
substreams-solana-utils = { git = "https://github.com/0xpapercut/substreams-solana-utils", tag = "v0.1.7" }
raydium-amm-substream = { git = "https://github.com/0xpapercut/solana-substreams", tag = "v0.1.7" }
bs58 = "0.5.1"
rdkafka = { version = "0.28", features = ["tokio"] }

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
