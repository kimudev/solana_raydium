specVersion: v0.1.0
package:
  name: 'solana_kafka'
  version: v0.1.0

imports:
  raydium_amm_events: https://spkg.io/streamingfast/raydium-amm-events-v0.1.7.spkg
  spl_token_events: https://spkg.io/streamingfast/spl-token-events-v0.1.7.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: target/wasm32-unknown-unknown/release/solana_kafka.wasm

modules:
  - name: block_kafka_output
    kind: map
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:json

network: solana

sink:
  module: block_kafka_output
  type: kafka
  config:
    brokers: "localhost:9092"
    topic: "raydium_amm_events"
